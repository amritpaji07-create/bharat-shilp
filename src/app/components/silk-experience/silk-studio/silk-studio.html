<main class="silk-studio-page" aria-labelledby="silk-styles-title">
  <!-- Clean Professional Top Bar & Breadcrumb -->
  <div class="studio-topbar">
    <div class="topbar-left">
      <button type="button" class="studio-back-button" (click)="market.setView('home')" aria-label="Back to Shreem Home">
        <span aria-hidden="true">←</span>
        Back to Shreem
      </button>
      <span class="studio-breadcrumb">
        <span>Home</span>
        <span class="breadcrumb-slash">/</span>
        <strong>Handloom Sarees · SHREEM Village Collection</strong>
      </span>
    </div>

    <!-- Quick Navigation Anchor Links -->
    <nav class="studio-anchors" aria-label="Silk Studio sections">
      <button type="button" (click)="scrollToSection('six-moods-section')">Saree Styles</button>
      <button type="button" (click)="market.setView('try-the-look')">Try the Look</button>
      <button type="button" (click)="scrollToSection('pick-a-silk-section')">Pick a Silk</button>
      <button type="button" (click)="scrollToSection('silk-rail-section')">The Rack</button>
    </nav>
  </div>

  <!-- 1. The SHREEM Archive: Six Moods. Timeless Drapes -->
  <app-six-moods />

  <!-- 2. Pick a Silk: Fanned cards with giant condensed title -->
  <app-pick-a-silk />

  <!-- 3. Every silk, on the rail: Clothes rail with Rack Detail Modal -->
  <app-silk-rail />
</main>
