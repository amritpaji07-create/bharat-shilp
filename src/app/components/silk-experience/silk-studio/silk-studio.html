<main class="silk-studio-page" aria-labelledby="silk-styles-title">
  <!-- Clean Professional Top Bar & Breadcrumb -->
  <div class="studio-topbar">
    <div class="topbar-left">
      <button type="button" class="studio-back-button" (click)="market.setView('home')" aria-label="Back to Shreem Home">
        <span aria-hidden="true">←</span>
        Back to Shreem
      </button>
      <span class="studio-breadcrumb">
        <span>Home</span>
        <span class="breadcrumb-slash">/</span>
        <strong>Handloom Sarees · SHREEM Village Collection</strong>
      </span>
    </div>

    <!-- Quick Navigation Anchor Links -->
    <nav class="studio-anchors" aria-label="Silk Studio sections">
      <button type="button" (click)="scrollToSection('six-moods-section')">Saree Styles</button>
      <button type="button" (click)="market.setView('try-the-look')">Try the Look</button>
      <button type="button" (click)="scrollToSection('pick-a-silk-section')">Pick a Silk</button>
      <button type="button" (click)="scrollToSection('silk-rail-section')">The Rack</button>
    </nav>
  </div>

  <!-- ALL CRAFT STUDIOS & MARKETPLACES SWITCHER RIBBON -->
  <div class="marketplace-studios-ribbon" aria-label="Switch between artisan studios">
    <div class="ribbon-container">
      <span class="ribbon-label">EXPLORE ALL CRAFT STUDIOS:</span>
      <div class="ribbon-links">
        <button type="button" class="studio-pill is-active" aria-current="page">
          <span class="pill-dot"></span>
          <span>🥻 Silk Studio (Handloom Sarees)</span>
        </button>
        <button type="button" class="studio-pill" (click)="market.setView('coconut-studio')">
          <span>🥥 Coconut Studio (Thenga Craft)</span>
        </button>
        <button type="button" class="studio-pill" (click)="market.setView('honey-studio')">
          <span>🍯 Honey Studio (Van Amrit)</span>
        </button>
        <button type="button" class="studio-pill" (click)="market.setView('pottery-studio')">
          <span>🏺 Pottery Studio (Mitti & Kiln)</span>
        </button>
        <button type="button" class="studio-pill" (click)="market.setView('agarbatti-studio')">
          <span>🪔 Sacred Incense (Sugandh & Dhoop)</span>
        </button>
        <button type="button" class="studio-pill pill-all" (click)="market.setView('catalogue')">
          <span>🛍️ Browse All Products →</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 1. The SHREEM Archive: Six Moods. Timeless Drapes -->
  <app-six-moods />

  <!-- 2. Pick a Silk: Fanned cards with giant condensed title -->
  <app-pick-a-silk />

  <!-- 3. Every silk, on the rail: Clothes rail with Rack Detail Modal -->
  <app-silk-rail />
</main>
